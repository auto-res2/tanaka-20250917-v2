[project]
name = "cover-spo-research"
version = "0.1.0"
description = "Implementation of CoVeR-SPO for certified safety in LLMs."
authors = [{name = "ML Researcher", email = "researcher@example.com"}]
readme = "README.md"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.dependencies]
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.23.0",
    "PyYAML>=6.0",
    "transformers>=4.38.0",
    "datasets>=2.16.0",
    "peft>=0.9.0",
    "accelerate>=0.27.0",
    "bitsandbytes>=0.41.3",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0"
]
